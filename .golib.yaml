schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/math
      archive: .verification/mutation/bootstrap/adapters-math.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/measurement
      archive: .verification/mutation/bootstrap/adapters-measurement.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/temporal
      archive: .verification/mutation/bootstrap/adapters-temporal.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt
    - module: adapters/math
      mode: apidiff
      path: adapters/math/api/baseline.txt
    - module: adapters/measurement
      mode: apidiff
      path: adapters/measurement/api/baseline.txt
    - module: adapters/temporal
      mode: apidiff
      path: adapters/temporal/api/baseline.txt

operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParseJSON$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPath$'
        budget: 2s
        timeout: 2m
  - module: adapters/math
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDecimalTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDecimalOperatorBoundaries$'
        budget: 2s
        timeout: 2m
  - module: adapters/measurement
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzQuantityTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzQuantityOperatorPairs$'
        budget: 2s
        timeout: 2m
  - module: adapters/temporal
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPeriodTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzInstantTaggedValues$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: competitors
        timeout: 20m
  - module: adapters/math
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: adapters/measurement
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: adapters/temporal
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
