schema_version: 1
tool_version: v2.4.0
tool_checksums_sha256: 875e5592e9fbea713c492d9e6979202e1d6bf687f52f55654e3e72c192963273

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

coverage:
  modules:
    - module: .
      mode: evidence

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/math
      archive: .verification/mutation/bootstrap/adapters-math.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/measurement
      archive: .verification/mutation/bootstrap/adapters-measurement.zip
      ledger: .verification/mutation/migration-ledger.json
    - module: adapters/temporal
      archive: .verification/mutation/bootstrap/adapters-temporal.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt
    - module: adapters/math
      mode: apidiff
      path: adapters/math/api/v2.txt
    - module: adapters/measurement
      mode: apidiff
      path: adapters/measurement/api/v3.txt
    - module: adapters/temporal
      mode: apidiff
      path: adapters/temporal/api/v2.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^TestContextsCachesAndCustomOperatorsAreConcurrentSafe$'
        count: 1
        race: true
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: integration
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParseJSON$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPath$'
        budget: 2s
        timeout: 2m
  - module: adapters/math
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDecimalTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzDecimalOperatorBoundaries$'
        budget: 2s
        timeout: 2m
  - module: adapters/measurement
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzQuantityTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzQuantityOperatorPairs$'
        budget: 2s
        timeout: 2m
  - module: adapters/temporal
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzPeriodTaggedValues$'
        budget: 2s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzInstantTaggedValues$'
        budget: 2s
        timeout: 2m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: competitors
        timeout: 20m
  - module: adapters/math
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: adapters/measurement
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
  - module: adapters/temporal
    gate: benchmark
    steps:
      - type: go-test
        packages: [./...]
        benchmark: .
        budget: 100ms
        timeout: 20m
